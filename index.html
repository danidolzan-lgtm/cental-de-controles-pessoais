<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meus Controles</title>
<meta name="theme-color" content="#2563EB"><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script src="sync.js" data-app="geral" data-show-user="1"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#EEF3FC;--surface:#FFFFFF;--line:#DDE4F2;--fg:#13203B;--muted:#58668A;--accent:#2563EB;--gc:#2563EB;
  --f-display:"Archivo",system-ui,sans-serif;--f-body:"IBM Plex Sans",system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root{--bg:#0B1220;--surface:#16213A;--line:#2A3A5C;--fg:#E6EDFA;--muted:#9AA9C7;--accent:#60A5FA;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);transition:background-color .3s;min-height:100dvh;background-attachment:fixed!important}
html[data-g] body{background-image:radial-gradient(1000px 520px at 0% -10%,color-mix(in srgb,var(--gc) 22%,transparent),transparent 62%),radial-gradient(900px 460px at 100% 0%,color-mix(in srgb,var(--gc) 12%,transparent),transparent 60%)!important}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:24px 48px;display:grid;gap:18px}
.wrap>*{min-width:0}
[hidden]{display:none!important}
h1{font-family:var(--f-display);font-weight:800;font-size:1.8rem;margin:0}
.sub{color:var(--muted);font-size:.9rem;margin:4px 0 0}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* tela inicial: os 3 módulos no meio */
.home{min-height:calc(100dvh - 150px);display:grid;align-content:center;gap:22px;text-align:center}
.mods{display:grid;gap:16px;grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:760px){.mods{grid-template-columns:minmax(0,1fr)}.home{text-align:left;min-height:calc(100dvh - 120px)}}
.mod{--gc:#2563EB;appearance:none;font:inherit;color:var(--fg);text-align:left;cursor:pointer;position:relative;overflow:hidden;border:1px solid var(--line);border-radius:20px;padding:22px;background:var(--surface);display:grid;gap:14px;box-shadow:0 14px 30px -22px var(--gc);transition:transform .16s ease,box-shadow .16s,border-color .16s;animation:up .35s ease both}
.mod:nth-child(2){animation-delay:.05s}.mod:nth-child(3){animation-delay:.1s}
.mod::before{content:"";position:absolute;inset:0;background:linear-gradient(160deg,color-mix(in srgb,var(--gc) 24%,transparent),transparent 70%);pointer-events:none}
.mod:hover,.mod:focus-visible{transform:translateY(-4px);border-color:color-mix(in srgb,var(--gc) 50%,transparent);box-shadow:0 20px 36px -20px var(--gc);outline:none}
.mod .gi{position:relative;width:58px;height:58px;border-radius:16px;display:grid;place-items:center;color:#fff;font:800 1.1rem var(--f-display);background:linear-gradient(135deg,var(--gc),color-mix(in srgb,var(--gc) 55%,#7C3AED));box-shadow:0 10px 20px -8px var(--gc)}
.mod b{position:relative;font:800 1.3rem var(--f-display)}
.mod small{position:relative;color:var(--muted);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.mod>*{min-width:0}@media (max-width:760px){.mod .pgc{display:none}}.mod b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mod .go{position:relative;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:.88rem;color:var(--gc)}
.mod .go i{font-style:normal;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--gc) 14%,transparent)}
@media (max-width:760px){.mod{grid-template-columns:auto minmax(0,1fr);align-items:center;padding:16px;gap:4px 14px}.mod .gi{grid-row:1 / span 2;width:50px;height:50px}.mod .go{grid-column:1/-1;margin-top:8px}}
/* dentro de um módulo */
.bar{position:sticky;top:calc(var(--site-h,58px) + env(safe-area-inset-top,0px));z-index:5;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:6px 0}
.btn-home{appearance:none;font:600 .92rem var(--f-body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn-home:hover{border-color:var(--gc);color:var(--gc)}
.btn-home svg{width:18px;height:18px}
.gh{display:flex;align-items:center;gap:14px;animation:up .3s ease both}.gh>div{min-width:0;flex:1}.gh .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gh .gi{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;color:#fff;font:800 1rem var(--f-display);background:linear-gradient(135deg,var(--gc),color-mix(in srgb,var(--gc) 55%,#7C3AED));box-shadow:0 10px 20px -8px var(--gc);flex:none}
.gh h1{background:linear-gradient(90deg,var(--gc),color-mix(in srgb,var(--gc) 50%,#7C3AED));-webkit-background-clip:text;background-clip:text;color:transparent!important}
h2{font-family:var(--f-display);font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:4px 0 0}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))}
@media (max-width:560px){.tiles{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}}
.tiles>*{min-width:0}#grupo{grid-template-columns:minmax(0,1fr)}#grupo>*{min-width:0}
a.tile{display:grid;gap:10px;align-content:start;text-decoration:none;color:var(--fg);background:color-mix(in srgb,var(--gc) 6%,var(--surface));border:1px solid color-mix(in srgb,var(--gc) 16%,var(--line));border-radius:16px;padding:16px;box-shadow:0 10px 22px -20px var(--gc);transition:transform .14s ease,box-shadow .14s,border-color .14s;animation:up .3s ease both}
a.tile:hover,a.tile:focus-visible{transform:translateY(-3px);border-color:color-mix(in srgb,var(--gc) 50%,transparent);box-shadow:0 16px 28px -16px var(--gc);outline:none}
a.tile .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--gc) 16%,transparent);color:var(--gc)}
a.tile .ic svg{width:22px;height:22px}
a.tile b{font:800 1.02rem var(--f-display)}
a.tile small{color:var(--muted);font-size:.8rem;line-height:1.3;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
a.tile>span:not(.ic):not(.ar):not(.tm){min-width:0;overflow:hidden}a.tile b{display:inline-block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom}
a.tile{position:relative}a.tile .ar{position:absolute;top:14px;right:14px;color:var(--gc);font-weight:700}
@media (max-width:560px){a.tile{padding:12px;gap:8px}a.tile .ic{width:36px;height:36px}}
.links{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))}
a.lnk{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
a.lnk:hover{border-color:var(--gc)}
a.lnk b{font-weight:600}a.lnk span{color:var(--muted);font-size:.8rem;display:block}
a.lnk .ar{margin-left:auto;color:var(--gc);font-weight:700}
/* organizar os atalhos do módulo (03/11/2026) */
.btn-org{appearance:none;font:600 .88rem var(--f-body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.btn-org svg{width:17px;height:17px}.btn-org:hover{border-color:var(--gc);color:var(--gc)}
.btn-org.on{background:var(--gc);border-color:var(--gc);color:#fff}
.btn-org{flex:none;margin-left:auto;width:44px;height:44px;padding:0;justify-content:center;border-radius:14px;box-shadow:0 8px 18px -14px var(--gc)}
.btn-org span{display:none}
.gh h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.osh-v{position:fixed;inset:0;z-index:95;background:rgba(15,23,42,.38);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:of .16s ease}
.osh{position:fixed;z-index:96;background:var(--surface);border:1px solid var(--line);box-shadow:0 30px 60px -20px rgba(15,23,42,.55);padding:8px;display:grid;gap:2px;width:290px;border-radius:18px;animation:op .2s cubic-bezier(.2,.8,.2,1)}
.osh h4{margin:6px 10px 6px;font:800 .72rem var(--f-display);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.osh button{appearance:none;font:inherit;color:var(--fg);background:transparent;border:0;border-radius:12px;padding:10px;display:grid;grid-template-columns:36px minmax(0,1fr) 20px;gap:10px;align-items:center;text-align:left;cursor:pointer}
.osh button:hover{background:color-mix(in srgb,var(--gc) 8%,transparent)}
.osh button .i{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--gc) 14%,transparent);color:var(--gc)}
.osh button .i svg{width:18px;height:18px}
.osh button b{display:block;font-weight:600;font-size:.94rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.osh button small{display:block;color:var(--muted);font-size:.76rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.osh button .ck{color:var(--gc);font-weight:800;opacity:0}.osh button.on .ck{opacity:1}
.osh button.on{background:color-mix(in srgb,var(--gc) 10%,transparent)}
.osh hr{border:0;border-top:1px solid var(--line);margin:4px 8px}
@keyframes of{from{opacity:0}to{opacity:1}}@keyframes op{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
@keyframes os{from{transform:translateY(100%)}to{transform:none}}
@media (max-width:640px){.osh{left:0!important;right:0!important;top:auto!important;bottom:0;width:auto;border-radius:22px 22px 0 0;padding:8px 10px calc(14px + env(safe-area-inset-bottom,0px));animation:os .24s cubic-bezier(.2,.8,.2,1)}
 .osh::before{content:"";width:40px;height:5px;border-radius:3px;background:var(--line);justify-self:center;margin:2px 0 4px}}
.orgtip{font-size:.85rem;color:var(--muted);background:color-mix(in srgb,var(--gc) 8%,var(--surface));border:1px dashed color-mix(in srgb,var(--gc) 40%,var(--line));border-radius:12px;padding:10px 12px}
.tiles.org a.tile{cursor:default;animation:wob .35s ease}
.tiles.org a.tile:hover{transform:none}
.tiles.org a.tile .ar{display:none}
@keyframes wob{0%{transform:rotate(0)}30%{transform:rotate(-1deg)}60%{transform:rotate(1deg)}100%{transform:rotate(0)}}
.tm{display:none}
.tiles.org .tm{display:flex;position:absolute;top:8px;right:8px;gap:4px;align-items:center}
.tm button,.tm .dg{appearance:none;width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--fg);display:grid;place-items:center;cursor:pointer;font:700 .8rem var(--f-body);padding:0}
.tm .dg{cursor:grab;touch-action:none;color:var(--gc);font-size:1rem}
.tm button:hover,.tm .dg:hover{border-color:var(--gc);color:var(--gc)}
a.tile.arr{opacity:.92;transform:scale(1.04) rotate(-1deg)!important;box-shadow:0 20px 40px -14px var(--gc);z-index:5;border-color:var(--gc)}
@media (max-width:560px){.tiles.org .tm{top:6px;right:6px}.tm button,.tm .dg{width:26px;height:26px}}
</style></head><body>
<div class="wrap">
  <section class="home" id="home">
    <div><h1>Meus Controles</h1><p class="sub">Escolha o módulo. Seus dados ficam salvos na sua conta e aparecem iguais no celular e no PC.</p></div>
    <div class="mods" id="mods"></div>
  </section>
  <section id="grupo" hidden style="display:grid;gap:16px">
    <div class="gh"><span class="gi" id="gIc"></span><div><h1 id="gTit"></h1><p class="sub" id="gSub"></p></div>
      <button type="button" class="btn-org" id="bOrg" aria-haspopup="menu" aria-label="Ordenar e organizar" title="Ordenar e organizar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"/></svg><span>Concluir</span></button></div>
    <div class="orgtip" id="orgtip" hidden>Arraste os cartões pelo <b>⠿</b> (ou use ◀ ▶) para colocar na ordem que quiser. Toque no <b>✓</b> lá em cima quando terminar.</div>
    <div class="tiles" id="tiles"></div>
    <div id="links"></div>
  </section>
</div>
<script>
(function(){
  const MC=window.__MC||{GROUPS:[],ICO:{},DESC:{}};
  const SUB={ob:"Quotex · M1 · os 5 operacionais",b3:"Mini índice e mini dólar",pes:"Rotina, casa e finanças"};
  /* links viram cards junto com as páginas: [url, título, descrição, chave do link salvo, posição] — posição = depois de qual página ("" = no fim) */
  const IL=(d)=>"<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'>"+d+"</svg>";
  const LICO={"Quotex":IL("<path d='M4 19l5-6 4 3 7-9'/><path d='M15 7h5v5'/>"),"Notícias":IL("<rect x='3' y='4' width='18' height='16' rx='3'/><path d='M7 9h10M7 13h10M7 17h6'/>"),"Claude":IL("<path d='M4 5h16v11H9l-5 4z'/>")};
  const LINKS={
    ob:[["https://quotex.com/pt/trade","Quotex","Corretora · operar","","checklist-ob"],["https://br.investing.com/economic-calendar","Notícias","Calendário econômico","","checklist-ob"],["analise-ob.html#cfgBox","Claude","Conversa OB · prints e dúvidas","analiseOB.claudeUrl",""]],
    b3:[["https://br.investing.com/economic-calendar","Notícias","Calendário econômico","","checklist-b3"],["analise-b3.html#cfgBox","Claude","Conversa B3 · prints e dúvidas","analiseB3.claudeUrl",""]]};
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const sigla=g=>g.s==="Pessoal"?"EU":g.s;
  const $=id=>document.getElementById(id);
  $("mods").innerHTML=MC.GROUPS.map(g=>"<button type='button' class='mod' data-k='"+g.k+"' style='--gc:"+g.c+"'><span class='gi'>"+esc(sigla(g))+"</span><b>"+esc(g.g)+"</b><small>"+esc(SUB[g.k]||"")+"</small><span class='go'>Abrir<i>→</i></span></button>").join("");
  function abrir(k){
    const g=MC.GROUPS.find(x=>x.k===k);if(org){org=false;if(cur)fixarPers()}
    if(!g){document.documentElement.removeAttribute("data-g");document.documentElement.style.removeProperty("--gc");$("home").hidden=false;$("grupo").hidden=true;try{sessionStorage.removeItem("index.tab")}catch(e){}return}
    document.documentElement.setAttribute("data-g",k);document.documentElement.style.setProperty("--gc",g.c);
    $("home").hidden=true;$("grupo").hidden=false;
    $("gIc").textContent=sigla(g);$("gTit").textContent=g.g;$("gSub").textContent=SUB[k]||"";
    const L=LINKS[k]||[];
    const cardPg=it=>"<a class='tile' href='"+it[0]+".html'><span class='ic'>"+(MC.ICO[it[1]]||"")+"</span><span><b>"+esc(it[1])+"</b><br><small>"+esc(MC.DESC[it[0]]||"")+"</small></span></a>";
    const cardLk=l=>{let u=l[0],ext=/^https?:/.test(u),sp=l[2];
      if(l[3]){let s="";try{s=localStorage.getItem(l[3])||""}catch(e){}if(s){u=s;ext=true}else sp="Configure na Análise de entrada"}
      return "<a class='tile lk' href='"+esc(u)+"'"+(ext?" target='_blank' rel='noopener'":"")+"><span class='ic'>"+(LICO[l[1]]||"")+"</span><span><b>"+esc(l[1])+"</b><br><small>"+esc(sp)+"</small></span><span class='ar'>"+(ext?"↗":"→")+"</span></a>"};
    let h=[];
    g.items.forEach(it=>{h.push({k:"p:"+it[0],n:it[1],u:it[0],h:cardPg(it)});L.filter(l=>l[4]===it[0]).forEach(l=>h.push({k:"l:"+l[1],n:l[1],u:"l:"+l[1],h:cardLk(l)}))});
    L.filter(l=>!l[4]).forEach(l=>h.push({k:"l:"+l[1],n:l[1],u:"l:"+l[1],h:cardLk(l)}));
    cur=k;itens=h;desenhar();
    $("links").innerHTML="";
    try{sessionStorage.setItem("index.tab",k)}catch(e){}
    window.scrollTo({top:0});
  }
  /* ---------- organizar os atalhos de cada módulo ---------- */
  let cur=null,itens=[],org=false;
  const LSO="mc.ordem";
  let ORD={};try{ORD=JSON.parse(localStorage.getItem(LSO)||"{}")}catch(e){}
  const usados=()=>{try{return JSON.parse(localStorage.getItem("mc.usados")||"{}")}catch(e){return {}}};
  let dbO=null;
  function gravar(){try{localStorage.setItem(LSO,JSON.stringify(ORD))}catch(e){}if(dbO)dbO.doc("config/ordem").set({ord:JSON.stringify(ORD),em:new Date().toISOString()}).catch(()=>{})}
  function ordenados(){
    const o=ORD[cur]||{}, m=o.modo||"padrao";
    if(m==="az")return itens.slice().sort((a,b)=>a.n.localeCompare(b.n,"pt-BR"));
    if(m==="rec"){const u=usados();return itens.map((x,i)=>({x,i})).sort((a,b)=>(u[b.x.u]||0)-(u[a.x.u]||0)||a.i-b.i).map(y=>y.x)}
    if(m==="pers"&&o.lista){const pos=k=>{const i=o.lista.indexOf(k);return i<0?999:i};return itens.map((x,i)=>({x,i})).sort((a,b)=>pos(a.x.k)-pos(b.x.k)||a.i-b.i).map(y=>y.x)}
    return itens.slice();
  }
  function desenhar(){
    const m=(ORD[cur]||{}).modo||"padrao";
    $("bOrg").classList.toggle("on",org);$("bOrg").title=org?"Concluir":"Ordenar e organizar";$("bOrg").setAttribute("aria-label",org?"Concluir":"Ordenar e organizar");
    $("bOrg").querySelector("svg").innerHTML=org?"<path d='M5 12.5l4.5 4.5L19 7.5' stroke-width='2.6'/>":"<path d='M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4'/>";
    $("orgtip").hidden=!org;$("tiles").classList.toggle("org",org);
    const tm="<span class='tm'><button type='button' data-mv='-1' aria-label='Mover para antes'>◀</button><button type='button' data-mv='1' aria-label='Mover para depois'>▶</button><span class='dg' aria-hidden='true'>⠿</span></span>";
    $("tiles").innerHTML=ordenados().map((x,i)=>x.h.replace("<a class='tile","<a data-key='"+esc(x.k)+"' data-u='"+esc(x.u)+"' style='animation-delay:"+(i*.03)+"s' class='tile").replace(/<\/a>$/,tm+"</a>")).join("");
  }
  function fixarPers(){const keys=[...$("tiles").querySelectorAll("a.tile")].map(a=>a.dataset.key);ORD[cur]={modo:"pers",lista:keys};gravar()}
  const SI=d=>"<svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'>"+d+"</svg>";
  const OPC=[["padrao","Padrão","A ordem original",SI("<rect x='4' y='4' width='6' height='6' rx='1.5'/><rect x='14' y='4' width='6' height='6' rx='1.5'/><rect x='4' y='14' width='6' height='6' rx='1.5'/><rect x='14' y='14' width='6' height='6' rx='1.5'/>")],
    ["az","A → Z","Ordem alfabética",SI("<path d='M4 18l3.5-10L11 18M5.2 14.5h4.6M14 8h6l-6 10h6'/>")],
    ["rec","Usados por último","Último aberto vem primeiro",SI("<circle cx='12' cy='12' r='8'/><path d='M12 8v4l3 2'/>")],
    ["pers","Personalizado","A ordem que você montou",SI("<path d='M12 20s-7-4.5-7-10a4 4 0 017-2.6A4 4 0 0119 10c0 5.5-7 10-7 10z'/>")]];
  function fecharOpc(){document.querySelectorAll(".osh,.osh-v").forEach(x=>x.remove());$("bOrg").setAttribute("aria-expanded","false")}
  function abrirOpc(){
    fecharOpc();const m=(ORD[cur]||{}).modo||"padrao";
    const v=document.createElement("div");v.className="osh-v";v.onclick=fecharOpc;
    const sh=document.createElement("div");sh.className="osh";sh.setAttribute("role","menu");
    sh.innerHTML="<h4>Ordenar atalhos</h4>"+OPC.map(o=>"<button type='button' role='menuitemradio' aria-checked='"+(o[0]===m)+"' class='"+(o[0]===m?"on":"")+"' data-m='"+o[0]+"'><span class='i'>"+o[3]+"</span><span><b>"+o[1]+"</b><small>"+o[2]+"</small></span><span class='ck'>✓</span></button>").join("")+
      "<hr><button type='button' role='menuitem' data-org='1'><span class='i'>"+SI("<path d='M9 5h.01M15 5h.01M9 12h.01M15 12h.01M9 19h.01M15 19h.01'/>")+"</span><span><b>Organizar do meu jeito</b><small>Arrastar e mudar de lugar</small></span><span></span></button>";
    sh.style.setProperty("--gc",getComputedStyle(document.documentElement).getPropertyValue("--gc"));
    document.body.appendChild(v);document.body.appendChild(sh);
    if(innerWidth>640){const r=$("bOrg").getBoundingClientRect();sh.style.top=(r.bottom+8)+"px";sh.style.left=Math.max(12,Math.min(innerWidth-302,r.right-290))+"px"}
    $("bOrg").setAttribute("aria-expanded","true");
    sh.onclick=e=>{const b=e.target.closest("button");if(!b)return;
      if(b.dataset.org){fecharOpc();fixarPers();org=true;desenhar();return}
      const o=ORD[cur]=ORD[cur]||{};o.modo=b.dataset.m;if(o.modo==="pers"&&!o.lista)o.lista=itens.map(x=>x.k);
      gravar();desenhar();fecharOpc();window.ui&&ui.toast("✓ "+b.querySelector("b").textContent)};
  }
  document.addEventListener("keydown",e=>{if(e.key==="Escape")fecharOpc()});
  addEventListener("resize",fecharOpc);
  $("bOrg").addEventListener("click",()=>{if(!cur)return;
    if(org){org=false;fixarPers();desenhar();window.ui&&ui.toast("✓ Ordem salva")}else abrirOpc()});
  // marca uso ao tocar num link externo (páginas marcam sozinhas ao abrir)
  $("tiles").addEventListener("click",e=>{
    const a=e.target.closest("a.tile");if(!a)return;
    if(org){e.preventDefault();e.stopPropagation();
      const mv=e.target.closest("[data-mv]");if(mv){const d=+mv.dataset.mv,irmao=d<0?a.previousElementSibling:a.nextElementSibling;if(irmao){a.parentNode.insertBefore(a,d<0?irmao:irmao.nextSibling);fixarPers()}}
      return}
    if(a.dataset.u&&a.dataset.u.startsWith("l:")){const u=usados();u[a.dataset.u]=Date.now();try{localStorage.setItem("mc.usados",JSON.stringify(u))}catch(x){}}
  });
  let D=null;
  $("tiles").addEventListener("pointerdown",e=>{if(!org)return;const h=e.target.closest(".dg");if(!h)return;e.preventDefault();const a=h.closest("a.tile");D={a};a.classList.add("arr");try{h.setPointerCapture(e.pointerId)}catch(x){}});
  document.addEventListener("pointermove",e=>{if(!D)return;e.preventDefault();
    const el=document.elementFromPoint(e.clientX,e.clientY),o=el&&el.closest("#tiles a.tile");
    if(o&&o!==D.a){const r=o.getBoundingClientRect(),mesmaLinha=Math.abs(e.clientY-(r.top+r.height/2))<r.height/2;
      const antes=mesmaLinha?e.clientX<r.left+r.width/2:e.clientY<r.top+r.height/2;o.parentNode.insertBefore(D.a,antes?o:o.nextSibling)}
    if(e.clientY<80)scrollBy(0,-10);else if(e.clientY>innerHeight-60)scrollBy(0,10)},{passive:false});
  const fimD=()=>{if(!D)return;D.a.classList.remove("arr");D=null;fixarPers()};
  document.addEventListener("pointerup",fimD);document.addEventListener("pointercancel",fimD);
  // a ordem também fica salva na conta (aparece igual no celular e no PC)
  (async()=>{try{dbO=window.claude?await window.claude.use("db"):null}catch(e){dbO=null}if(!dbO)return;
    dbO.doc("config/ordem").onSnapshot(s=>{if(!s.exists){if(Object.keys(ORD).length)gravar();return}
      try{const r=JSON.parse(s.data().ord||"{}");if(JSON.stringify(r)!==JSON.stringify(ORD)){ORD=r;try{localStorage.setItem(LSO,JSON.stringify(ORD))}catch(e){}if(cur&&!org&&!D)desenhar()}}catch(e){}},()=>{})})();

  /* 03/11/2026: o histórico é sempre [menu principal] → [módulo] → [página].
     Abrir um módulo cria a posição do módulo; o voltar do celular desce um nível por vez. */
  const est=()=>{try{return history.state||{}}catch(e){return {}}};
  $("mods").addEventListener("click",e=>{const b=e.target.closest(".mod");if(!b)return;
    try{history.pushState({mcMod:b.dataset.k},"",location.pathname)}catch(x){}mostrado=b.dataset.k;abrir(b.dataset.k)});
  if(location.hash){try{history.replaceState(history.state,"",location.pathname)}catch(e){}}
  let mostrado;
  function mostrar(){let st=est();if(st.mcSub)return;
    if(st.mcMod){let lg=null;try{lg=sessionStorage.getItem("mc.lastGroup")}catch(e){}
      if(lg&&lg!==st.mcMod&&MC.GROUPS.some(g=>g.k===lg)){try{history.replaceState({mcMod:lg},"",location.pathname)}catch(e){}st={mcMod:lg}}
      if(mostrado!==st.mcMod){mostrado=st.mcMod;abrir(st.mcMod)}}
    else if(mostrado!==null){mostrado=null;abrir(null)}
    try{sessionStorage.removeItem("mc.depth")}catch(e){}}
  window.__mcHome=()=>{if(est().mcMod)history.back();else{mostrado=null;abrir(null);window.scrollTo({top:0})}};
  window.__mcAbrir=k=>abrir(k);
  mostrar();
  addEventListener("pageshow",e=>{if(e.persisted){mostrado=undefined;mostrar()}});
  addEventListener("popstate",mostrar);
})();
</script>
</body></html>
